name: Import Endor Customer Success MCP Kit

on:
  push:
    paths:
      - '.github/workflows/import-endor-kit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Set up one-time Endor MCP kit import' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand previously uploaded kit into repository root
        shell: bash
        run: |
          set -euo pipefail
          git show a0c4cf1c193c902b2168e4d7a913a8409511eae1:Endor_CS_MCP_Kit.zip > /tmp/endor-kit.zip
          mkdir -p /tmp/endor-extract
          unzip -q /tmp/endor-kit.zip -d /tmp/endor-extract
          test -f /tmp/endor-extract/Endor_CS_MCP_Kit/README.md
          test -f /tmp/endor-extract/Endor_CS_MCP_Kit/src/server.mjs
          cp -a /tmp/endor-extract/Endor_CS_MCP_Kit/. ./
          # The workflow file is added separately with the GitHub connection,
          # because the Actions GITHUB_TOKEN cannot create workflow files.
          rm -f .github/workflows/pilot-tests.yml
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add Endor Digital Customer Success MCP pilot"
          git push origin HEAD:main
