Churn risk and account health are dated CSM assessments. Coverage is a product adoption measure. Observed value is scoped to the deployment and reporting window.","action_boundary":"MCP can read owned tasks and append a user-directed update to the warehouse. The action register tracks the accountable CSM separately from the customer contact.","account_identifiers":"account_id is stable alphanumeric text. account_name is the CRM display label. Prior aliases resolve via account_alias.","licensing":"Licensed seats are purchased contract entitlements. For contributor contracts, utilization is 90-day active contributing developers divided by licensed seats. The portfolio ratio is displayed only for a single active contract. Review contract-level detail for multiple agreements.","portfolio_adoption":"The portfolio adoption rate uses the sole active deployment with fresh coverage. Review deployment-level rates when an account has multiple active scopes.","action_revision":"Update the current revision. A completion can create one dated follow-up atomically. A retry with the same revision, editor and outcome reuses the recorded result.","lifecycle_results":"First scans, sponsor acknowledgement, risk reassessment and expansion funding retain their own source evidence. Recording a CSM task outcome preserves those source facts.","evidence_event":"An event is a dated source record. A case or workstream references its event ID when it supports the decision.","observation":"The demo links a curated statement or measurable fact to a product capability, buying group, and source record or exact message. SQL calculates telemetry changes separately.","workstream":"A seeded CSM objective ties a scoped product use case and supporting event to accountable actions. Qualifying cases can link to the workstream.","expansion_research":"Simulated Sumble signals describe the organization and its initiatives. Simulated Clay profiles suggest people and roles within the scoped target entity. The existing discovery case comes from first-party evidence.","identity_match":"An exact work email joins a person to CRM and first-party marketing within the account. Matching the target buying group and entity is required for use in outreach.","stakeholder_intent":"The historical engagement agent combines exact stakeholder activity, scoped colleague observations, and simulated company signals. It outputs conditional hypotheses with evidence IDs, the reason each resource matters, timing, and a product fit to validate.","outreach_drafts":"A relevant attributed question and current discovery can support a direct stakeholder 1:1. Passive engagement and uncertain involvement can support a warm introduction through the evaluator. The saved draft includes the generated copy, recipient, workstream and evidence.","outreach_approval":"Approval captures an exact copy revision. An edit before queueing reopens review. The simulated Gong assignment uses the approved subject and body and queues a manual email step. Replaying the same transition at the same revision reuses it.","outreach_activity":"The simulated send and each simulated reply become labeled timeline events. The draft and the queued task remain workflow records. Simulated email activity is excluded from discovery qualification and first-party history."},"data_flow":[{"title":"Source records","description":"Original emails, CRM, support, telemetry, enablement activity and simulated market signals carry a source and date. Simulated Sumble and Clay records supply expansion research.","datasets":["source_system","subscription_contract","engagement_event","account_health_assessment","sumble_org_signal","clay_person_enrichment"]},{"title":"Canonical warehouse","description":"The warehouse links evidence to buying groups and product capabilities. It stores action updates, generated email copy and each review and delivery revision.","datasets":["buying_group","group_membership","product_deployment","adoption_snapshot","qualifica Platform Engineering evaluation","body":"Hi Drew,\n\nThanks for suggesting an evaluation with Platform Engineering. I’d like to get the right owners together for the next discussion.\n\nWould you have 20 minutes for a 1:1 to compare how a team enables its first scan today, agree what results each repo owner should see, and decide if two templates are worth testing? I can show how Endor Open Source uses reachability to help each service team decide which dependency findings to fix first. If useful, I can bring a relevant example from the Product Security rollout for context.\n\nThanks,\nMorgan Rivera","recipient":"Drew Ito","route":"direct_follow_up"},"copperline:rina":{"subject":"Introduction to Rina Sen for the Platform Engineering evaluation","body":"Hi Drew,\n\nThanks for raising the Platform Engineering evaluation. Could you introduce me to Rina Sen if they’re the right person to help scope the evaluation?\n\nI’d like to start with a short 1:1 with Rina to compare how a team enables its first scan today, agree what results each repo owner should see, and decide if two templates are worth testing. If useful, I can bring a relevant example from the Product Security rollout for context.\n\nThanks,\nMorgan Rivera","recipient":"Drew Ito","route":"warm_intro"},"clay-cc-jo":{"subject":"Following up on your Reachability-based SCA question","body":"Hi Jo,\n\nThanks for your question in our session on dependency reachability in reusable GitHub Actions workflows. It sounded like you’re trying to run one shared dependency check while keeping findings with each repo owner. Is that what you’re looking to validate?\n\nDrew and I have been discussing what to test for Platform Engineering. Would you have 20 minutes for a 1:1 to walk through a Java and a Go template, map who gets the findings today, and agree how to measure setup time? I can show how Endor Open Source uses reachability to help each service team decide which dependency findings to fix first. If useful, I can bring a relevant example from the Product Security rollout for context.\n\nThanks,\nMorgan Rivera","recipient":"Jo Mercer","route":"direct_follow_up"},"clay-cc-alma":{"subject":"Introduction to Alma Voss for the Platform Engineering evaluation","body":"Hi Drew,\n\nThanks for raising the Platform Engineering evaluation. Could you introduce me to Alma Voss if they’re the right person to define which findings should reach engineers and how policy exceptions are handled?\n\nI’d like to start with a short 1:1 with Alma to compare how a team enables its first scan today, agree what results each repo owner should see, and decide if two templates are worth testing. If useful, I can bring a relevant example from the Product Security rollout for context.\n\nThanks,\nMorgan Rivera","recipient":"Drew Ito","route":"warm_intro"}},"AC0005":{},"AC0004":{"stratos:felix":{"subject":"Fulfillment evaluation","body":"Hi Felix,\n\nThanks for suggesting an evaluation with Fulfillment. I’d like to get the right owners together for the next discussion.\n\nWould you have 20 minutes for a 1:1 to compare how one service team triages image findings today, identify who owns the build, and decide if a three-service evaluation is worth scoping? I can show how Endor Open Source uses container reachability to help a service owner prioritize image findings during triage. I’ll confirm the subsidiary and agreement scope with our account team before we discuss rollout.\n\nThanks,\nMorgan Rivera","recipient":"Felix Ortega","route":"direct_follow_up"},"clay-sc-nia":{"subject":"Introduction to Nia Okafor for the Fulfillment evaluation","body":"Hi Felix,\n\nThanks for raising the Fulfillment evaluation. Could you introduce me to Nia Okafor if they’re the right person to validate the technical scope and the results we need to collect?\n\nI’d like to start with a short 1:1 with Nia to compare how one service team triages image findings today, identify who owns the build, and decide if a three-service evaluation is worth scoping. I’ll confirm the subsidiary and agreement scope with our account team before we discuss rollout.\n\nThanks,\nMorgan Rivera","recipient":"Felix Ortega","route":"warm_intro"},"clay-sc-selene":{"subject":"Introduction to Selene Park for the Fulfillment evaluation","body":"Hi Felix,\n\nThanks for raising the Fulfillment evaluation. Could you introduce me to Selene Park if they’re the right person to clarify who would sponsor the evaluation and how funding decisions are made?\n\nI’d like to start with a short 1:1 with Selene to compare how one service team triages image findings today, identify who owns the build, and decide if a three-service evaluation is worth scoping. I’ll confirm the subsidiary and agreement scope with our account team before we discuss rollout.\n\nThanks,\nMorgan Rivera","recipient":"Felix Ortega","route":"warm_intro"}}},"event_details":{"bp-email":{"snapshot":{"snapshot_id":"endor-cs-demo-2026-11-20-v5","as_of_utc":"2026-11-20T20:00:00Z","rule_version":"cs-eligibility-v1","dataset_kind":"fictional_demo"},"event":{"event_id":"bp-email","account_id":"AC0001","occurred_at":"2026-11-19T15:42:00Z","event_kind":"email","title":"Payments SCA rollout · GitHub App approval","summary":"Theo owns the GitHub App approval for the next Payments dependency-scanning batch and will review it on November 24.","source_record_ref":"demo:bp-email","source_id":"customer_email","source_name":"Customer email","source_kind":"first_party","body":null,"details":{}},"groups":[{"buying_group_id":"brackenpay:payments-security","name":"Payments Rollout"}],"people":[{"person_id":"brackenpay:maya","full_name":"Maya Chen","job_title":"Security Engineering Lead"},{"person_id":"brackenpay:theo","full_name":"Theo Marshall","job_title":"Director, Platform Engineering"}],"observations":[{"observation_id":"bp-email:observation-3","account_id":"AC0001","event_id":"bp-email","use_case_id":"brackenpay:payments-sca","observation_kind":"rollout_blocker","evidence_role":"quali async function consoleCall(name, arguments_) {
  const response = await fetch("/api/console",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({jsonrpc:"2.0",id:"console",method:"tools/call",params:{name,arguments:arguments_}}),
  });
  if (!response.ok) throw new Error(response.status === 401 ? "Sign in to the console and try again." : "The console could not load this request. Try again.");
  const {result,error} = await response.json();
  if (error) throw new Error(error.message);
  if (result.isError) throw new Error(result.content[0].text);
  return result.structuredContent ?? JSON.parse(result.content[0].text);
}

function drawEdges(map, edges) {
  const bounds = map.getBoundingClientRect();
  const svg = map.querySelector(".map-svg");
  svg.setAttribute("viewBox",`0 0 ${map.clientWidth} ${map.clientHeight}`);
  const positions = new Map([...map.querySelectorAll("[data-node]")].map(element => {
    const box = element.getBoundingClientRect();
    return [element.dataset.node, {left:box.left-bounds.left, right:box.right-bounds.left,
      centerY:box.top-bounds.top+box.height/2}];
  }));
  svg.querySelector(".edge-paths").innerHTML = edges.map(({from,to},index) => {
    const a = positions.get(from), b = positions.get(to);
    if (!a || !b) return "";
    let path;
    if (Math.abs(a.left-b.left) < 2) {
      // Route same-column edges beside the cards, including the stacked mobile layout.
      const rail = Math.max(3,a.left-12-(index%3)*3);
      const route = Math.sign(b.centerY-a.centerY)*Math.min(22,Math.abs(b.centerY-a.centerY)/3);
      path = `M${a.left},${a.centerY} Q${rail},${a.centerY} ${rail},${a.centerY+route} L${rail},${b.centerY-route} Q${rail},${b.centerY} ${b.left-3},${b.centerY}`;
    } else {
      const direction = Math.sign(b.left-a.left);
      const start = direction > 0 ? a.right : a.left;
      const end = direction > 0 ? b.left-3 : b.right+3;
      const bend = (end-start)*.5;
      path = `M${start},${a.centerY} C${start+bend},${a.centerY} ${end-bend},${b.centerY} ${end},${b.centerY}`;
    }
    const hot = from === selected || to === selected ? ' class="hot"' : "";
    return '<path' + hot + ' data-edge-from="' + esc(from) + '" data-edge-to="' + esc(to) + '" d="' + path +
      '" marker-end="url(#arrow)"/>';
  }).join("");
}

function inspect(graph = data.graphs[account][mode]) {
  for (const element of document.querySelectorAll("[data-node]")) {
    element.setAttribute("aria-pressed",String(element.dataset.node === selected));
  }
  for (const element of document.querySelectorAll("[data-edge-from]")) {
    element.classList.toggle("hot",element.dataset.edgeFrom === selected || element.dataset.edgeTo === selected);
  }
  const node = graph.nodes.find(item => item.id === selected);
  if (!node) return;
  const relatedDataset = node.type === "account" ? "v_account_portfolio" : node.type;
  const connections = graph.edges.filter(edge => edge.from === selected || edge.to === selected);
  const eventId = node.type === "engagement_event" ? node.id : node.fields["Evidence event"] ?? node.fields["Event ID"];
  const observationsLink = eventId ? '<button class="ref" type="button" data-dataset="v_event_observations" data-event="' +
    esc(eventId) + '">Open event observations</button>' : '';
  const inspector = view.querySelector("#inspector");
  const outreach = node.outreach_scope ?
    '<button class="action review-outreach" type="button" data-review-outreach="' + esc(node.id) + '">Review outreach</button>' : "";
  inspector.innerHTML =
    '<p class="kind type-' + esc(node.type) + '">' + esc(typeLabels[node.type] ?? node.type) + '</p><h2>' + esc(node.label) + '</h2>' + outreach + '<dl>' +
    Object.entries(node.fields).map(([key,value]) => '<dt>' + esc(key) + '</dt><dd>' + esc(value ?? "Unknown") + '</dd>').join("") + '</dl>' +
    '<div class="related"><button class="ref" type="button" data-dataset="' + esc(relatedDataset) +

      return '<button class="edge-link" type="button" data-related="' + esc(linked.id) + '"><span>' +
        (fromHere ? "Outgoing · " : "Incoming · ") + esc(edge.label) + '</span><strong>' + esc(linked.label) + '</strong></button>';
    }).join("") + '</div>' : '');
  inspector.scrollTop = 0;
}

function render() {
  for (const button of document.querySelectorAll("[data-view]")) button.setAttribute("aria-pressed",String(button.dataset.view === active));
  if (active === "graph") buildGraph();
  else {
    graphObserver?.disconnect();
    if (active === "flow") buildFlow();
    else if (active === "datasets") buildDataset();
    else if (active === "outreach") buildOutreach();
    else if (active === "timeline") buildTimeline();
  }
}

document.addEventListener("click",event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.view) {
    active = button.dataset.view;
    render();
  } else if (button.dataset.mode) {
    mode = button.dataset.mode; selected = undefined; buildGraph();
    document.querySelector('[data-mode="' + mode + '"]').focus();
  } else if (button.dataset.node || button.dataset.related) {
    selected = button.dataset.node ?? button.dataset.related;
    inspect();
    if (button.dataset.related) [...document.querySelectorAll("[data-node]")].find(item => item.dataset.node === selected)?.focus();

    outreachPersonId = button.dataset.reviewOutreach ?? button.dataset.prospect;
    outreachDraftId = button.dataset.openDraft;

    document.querySelector("#outreach-person")?.focus();
  } else if (button.dataset.openEvent) {
    timelineEventId = button.dataset.openEvent;

    document.querySelector("#dataset-select").focus();

    evidenceEvent = undefined; buildDataset(); document.querySelector("#dataset-select").focus();
  } else if (button.id === "download-csv") {
    const {columns,rows:allRows} = data.datasets[dataset];

    const cell = value => '"' + String(value ?? "").replaceAll('"','""') + '"';

    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    link.download = dataset + (evidenceEvent ? "_" + evidenceEvent : "") + ".csv";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href),2000);
  }
});

let outreachPersonId;
let outreachDraftId;

const outreachStatusLabels = {draft:"Draft",approved:"Approved",queued:"Queued",sent:"Simulated sent",replied:"Simulated reply"};
const outreachRevisionLabels = {generate:"Generated and saved",edit:"Draft updated",approve:"Copy approved",queue:"Queued in Gong simulation",

const outreachRouteLabels = {direct_follow_up:"Direct follow-up",warm_intro:"Warm introduction"};

const displayTime = value => timeFormat.format(new Date(value));

function buildOutreach() {

async function loadOutreach(panel, person) {
  const scope = {account,buying_group:person.outreach_scope.buying_group_id,person:person.outreach_scope.person_id};
  panel.innerHTML = '<p class="empty" role="status">Loading saved drafts…</p>';
  try {
    const {drafts} = await consoleCall("list_outreach_drafts",scope);
    const id = outreachDraftId === "" ? null : drafts.find(item => item.draft_id === outreachDraftId)?.draft_id ?? drafts[0]?.draft_id;
    const result = id ? await consoleCall("get_outreach_draft",{draft_id:id}) : null;
    if (!panel.isConnected) return;
    renderOutreach(panel,scope,person,drafts,result);
  } catch (error) {
    if (!panel.isConnected) return;
    panel.innerHTML = '<div class="workflow-card"><p class="workflow-error" role="alert">' + esc(error.message) +
      '</p><button type="button" class="action" id="reload-outreach">Try again</button></div>';
    panel.querySelector("#reload-outreach").onclick = () => loadOutreach(panel,person);
  }
}

function renderOutreach(panel, scope, person, drafts, result, confirmation = "") {
  const draft = result?.draft;
  const rows = draft ? [draft,...drafts.filter(item => item.draft_id !== draft.draft_id)] : drafts;
  const control = rows.length ? '<label class="field">Saved message <select id="outreach-message">' +
    option("","New draft",draft?.draft_id ?? "") + rows.map(item => option(item.draft_id,
      item.subject + " · " + outreachStatusLabels[item.status],draft?.draft_id)).join("") + '</select></label>' : '';
  panel.innerHTML = '<div class="workflow-switch">' + control + '<p class="workflow-notice" role="status" tabindex="-1">' + esc(confirmation) + '</p></div>' +
    (draft ? savedOutreach(result) : '<div class="workflow-card"><h3>Prepare an email</h3><p class="workflow-muted">Use ' + esc(person.label) +
      '’s engagement and buying-group context to start a draft.</p><label class="field">Approach <select id="outreach-route">' +
      '<option value="">Use recommended approach</option><option value="direct_follow_up">Direct follow-up</option>' +
      '<option value="warm_intro">Warm introduction</option></select></label>' + workflowAction("Generate and save draft","generate",true) + '</div>') +
    '<p class="workflow-error" role="alert" hidden></p>';
  const messageSelector = panel.querySelector("#outreach-message");
  if (messageSelector) messageSelector.onchange = () => { outreachDraftId = messageSelector.value; loadOutreach(panel,person); };

  const requestIds = new Map();
  for (const button of panel.querySelectorAll("[data-outreach-operation]")) {
    button.onclick = async () => {
      const operation = button.dataset.outreachOperation;
      const subject = panel.querySelector("#message-subject")?.value.trim();
      const body = panel.querySelector("#message-body")?.value.trim();
      const reply = panel.querySelector("#reply-body")?.value.trim();
      const includesCopy = ["edit","approve","send"].includes(operation) && (subject !== draft?.subject || body !== draft?.body);
      const error = panel.querySelector(".workflow-error");
      const inputs = [...panel.querySelectorAll("button,select,input,textarea")];
      error.hidden = true;
      if ((includesCopy && (!subject || !body)) || (operation === "reply" && !reply)) {
        error.textContent = operation === "reply" ? "Enter the simulated reply." : "Enter a subject and email body.";
        error.hidden = false;
        return;
      }
      inputs.forEach(input => { input.disabled = true; });
      try {
        let saved;
        if (operation === "generate") {
          const route = panel.querySelector("#outreach-route").value;
          if (!requestIds.has(route)) requestIds.set(route,crypto.randomUUID());
          saved = await consoleCall("save_outreach_draft",{...scope,...(route ? {route} : {}),request_id:requestIds.get(route)});
        } else {
          saved = await consoleCall("update_outreach_draft",{
            draft_id:draft.draft_id, expected_revision:draft.revision, operation,
            ...(includesCopy ? {subject,body} : {}), ...(operation === "reply" ? {body:reply} : {}),
          });
        }
        if (!panel.isConnected) return;
        outreachDraftId = saved.draft.draft_id;
        renderOutreach(panel,scope,person,rows,saved,outreachRevisionLabels[operation]);
        panel.querySelector(".workflow-notice").focus();
      } catch (failure) {
        if (!panel.isConnected) return;
        error.textContent = failure.message;
        error.hidden = false;
        inputs.forEach(input => { input.disabled = false; });
      }
    };
  }
}

  const editable = ["draft","queued"].includes(draft.status);
  const readonly = editable ? "" : " readonly";
  const approved = history.findLast(item => item.operation === "approve");
  const queued = ["queued","sent","replied"].includes(draft.status);
  const evidence = draft.evidence;
  const sources = [...new Set([evidence.history_event_used_in_draft,evidence.discovery_event_id,...evidence.recent_first_party_event_ids].filter(Boolean))];
  const template = {
    draft:workflowAction("Save edits","edit") + workflowAction("Approve copy","approve",true),
    approved:workflowAction("Edit draft","edit") + workflowAction("Queue in Gong","queue",true),
    queued:workflowAction("Simulate send","send",true),
    sent:"",replied:"",
  };
  return '<div class="outreach-layout"><div><section class="workflow-card"><header class="workflow-heading"><h3>Email</h3>' +
    '<span class="status-chip status-' + esc(draft.status) + '">' + esc(outreachStatusLabels[draft.status]) + '</span></header>' +
    '<dl class="message-address"><dt>From</dt><dd>' + esc(draft.sender_name) + '</dd><dt>To</dt><dd>' + esc(draft.recipient_name) +
    ' <span>' + esc(draft.recipient_email) + '</span></dd><dt>Approach</dt><dd>' + esc(outreachRouteLabels[draft.route]) + '</dd></dl>' +
    '<label class="compose-field">Subject<input id="message-subject" maxlength="240" value="' + esc(draft.subject) + '"' + readonly + '></label>' +
    '<label class="compose-field">Body<textarea id="message-body" rows="9" maxlength="8000"' + readonly + '>' + esc(draft.body) + '</textarea></label>' +
    (draft.status === "queued" ? '<p class="workflow-muted">This simulates Morgan’s manual email task in Gong. You can edit the final copy before recording the send.</p>' : '') +
    (template[draft.status] ? '<div class="workflow-actions">' + template[draft.status] + '</div>' : '') + '</section>' +
    (events.length ? '<section class="workflow-card"><h3>Email activity</h3><div class="related">' + events.map(event =>
      '<button type="button" class="edge-link" data-open-event="' + esc(event.event_id) + '"><span>' +
      esc(displayTime(event.occurred_at)) + ' · ' + (event.operation === "send" ? 'Simulated send' : 'Simulated reply') +
      '</span><strong>' + esc(event.title) + '</strong></button>').join("") + '</div>' +
      '<label class="compose-field">Simulated reply<textarea id="reply-body" rows="3" maxlength="8000" placeholder="Enter the customer’s reply for the demo"></textarea></label>' +
      workflowAction("Log simulated reply","reply") + '</section>' : '') + '</div>' +
    '<aside><section class="workflow-card"><h3>Why this outreach</h3>' +
    (draft.why_now ? '<p class="workflow-muted">' + esc(draft.why_now) + '</p>' : '') +
    (draft.workstream_id ? '<p class="workflow-muted">Workstream <code>' + esc(draft.workstream_id) + '</code></p>' : '') +
    '<div class="ref-list evidence-links">' + sources.map(id => '<button class="ref" type="button" data-open-event="' + esc(id) +
      '">' + esc(id) + '</button>').join("") + '</div></section><section class="workflow-card"><h3>Review history</h3><ol class="revision-list">' +
    history.map(item => '<li><strong>' + esc(outreachRevisionLabels[item.operation]) + '</strong><time datetime="' + esc(item.recorded_at) +
      '">' + esc(displayTime(item.recorded_at)) + '</time></li>').join("") + '</ol>' +
    (approved && queued ? '<details class="workflow-details"><summary>Approved copy</summary><p class="message-subject">' + esc(approved.subject) +
      '</p><p class="message-body">' + esc(approved.body) + '</p></details>' : '') +
    (draft.handoff ? '<details class="workflow-details"><summary>Gong handoff details</summary><p class="workflow-muted">' +
      esc(draft.handoff.identity_resolution) + ' · Manual email step</p><p class="workflow-muted"><code>' + esc(draft.handoff.method + ' ' + draft.handoff.path) +
      '</code></p><p class="workflow-muted">Flow instance <code>' + esc(draft.handoff.flow_instance_id) + '</code></p>' +
      '<details><summary>Simulated assignment payload</summary><pre>' + esc(JSON.stringify(draft.handoff,null,2)) + '</pre></details></details>' : '') +
    '</section></aside></div>';
}

let timelineEventId;

async function buildTimeline() {
  const accountId = account;
  view.innerHTML = '<div class="controls">' + accountPicker() + '</div><div class="timeline-layout">' +
    '<section class="panel timeline-list" aria-label="Account activity"><h2>Account timeline</h2><div class="timeline-rows">' +
    '<p class="empty" role="status">Loading activity…</p></div></section>' +
    '<section class="panel timeline-detail" aria-label="Event details" aria-live="polite"></section></div>';
  const list = view.querySelector(".timeline-rows");
  try {
    const events = liveConsole ? (await consoleCall("list_timeline",{account:accountId,limit:50})).events :
      data.datasets.v_engagement_timeline.rows.filter(item => item.account_id === accountId);
    if (!list.isConnected) return;
    timelineEventId ??= events[0]?.event_id;
    list.innerHTML = events.length ? events.map(event =>
      '<button class="timeline-row" type="button" data-timeline-event="' + esc(event.event_id) + '" aria-pressed="false">' +
      '<span>' + esc(displayTime(event.occurred_at)) + ' · ' + esc(event.source_name) + '</span><strong>' +
      esc(event.title) + '</strong></button>').join("") : '<p class="empty">No recorded activity for this account.</p>';
    if (timelineEventId) showTimelineEvent(timelineEventId);
  } catch (error) {
    if (list.isConnected) list.innerHTML = '<p class="workflow-error" role="alert">' + esc(error.message) + '</p>';
  }
}

async function showTimelineEvent(id) {
  timelineEventId = id;
  for (const item of view.querySelectorAll("[data-timeline-event]")) {
    item.setAttribute("aria-pressed",String(item.dataset.timelineEvent === id));
  }
  const detail = view.querySelector(".timeline-detail");
  detail.innerHTML = '<p class="empty" role="status">Opening event…</p>';
  try {
    const result = liveConsole ? await consoleCall("get_event",{event_id:id}) : data.event_details[id];
    if (!detail.isConnected || timelineEventId !== id) return;
    if (!result) throw new Error("This event is available in the live console.");
    const {event,groups,messages,observations} = result;
    detail.innerHTML = '<div class="workflow-heading"><div><h2>' + esc(event.title) + '</h2><p>' + esc(displayTime(event.occurred_at)) +
      ' · ' + esc(event.source_name) + '</p></div><span class="status-chip">' + esc(event.source_kind === "simulated" ? "Simulation" : event.event_kind) +
      '</span></div><p class="event-summary">' + esc(event.summary) + '</p>' +
      (groups.length ? '<p class="workflow-muted">' + esc(groups.map(group => group.name).join(", ")) + '</p>' : '') +
      (Object.keys(event.details).length ? '<dl class="message-address event-attributes">' + Object.entries(event.details).map(([label,value]) =>
        '<dt>' + esc(label) + '</dt><dd>' + esc(value) + '</dd>').join("") + '</dl>' : '') +
      (messages.length ? '<div class="timeline-thread"><h3>Email thread</h3>' + messages.map(message =>
        '<article><strong>' + esc(message.sender) + '</strong><p class="workflow-muted">' + esc(displayTime(message.sent_at)) +
        (message.recipients.length ? ' · To ' + esc(message.recipients.map(person => person.full_name).join(", ")) : '') +
        '</p><p class="message-body">' + esc(message.body) + '</p></article>').join("") + '</div>' :
        (event.body ? '<p class="message-body">' + esc(event.body) + '</p>' : '')) +
      (observations.length ? '<div class="timeline-thread"><h3>Observations</h3>' + observations.map(observation =>
        '<article><strong>' + esc(observation.product_line + ' · ' + observation.buying_group) +
        '</strong><p class="message-body">' + esc(observation.observed_text) + '</p></article>').join("") + '</div>' : '') +
      (event.draft_id ? '<button class="action" type="button" data-open-draft="' + esc(event.draft_id) + '" data-prospect="' +
        esc(event.prospect_id) + '">Open saved outreach</button>' : '');
  } catch (error) {
    if (detail.isConnected && timelineEventId === id) detail.innerHTML = '<p class="workflow-error" role="alert">' + esc(error.message) + '</p>';
  }
}

render();</script>
